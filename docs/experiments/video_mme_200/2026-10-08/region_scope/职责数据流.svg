<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#172b4d">
  <title id="title">exp27补查范围与选择组织的数据流</title>
  <desc id="desc">Top-K种子形成原核心；所有核心扩窗合并继续组织选择，触发核心窗口并集独立决定新增细帧。全部粗帧与细帧进入原exp07前缀和预算。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#475569"/></marker></defs>
  <g stroke="#64748b" stroke-width="1.3">
    <rect fill="#f8fafc" rx="8" x="20" y="135" width="130" height="60"/>
    <rect fill="#eff6ff" rx="8" x="195" y="135" width="125" height="60"/>
    <rect fill="#eff6ff" rx="8" x="365" y="35" width="190" height="65"/>
    <rect fill="#eff6ff" rx="8" x="610" y="35" width="185" height="65"/>
    <rect fill="#ecfdf5" rx="8" x="365" y="230" width="190" height="65"/>
    <rect fill="#ecfdf5" rx="8" x="610" y="230" width="185" height="65"/>
    <rect fill="#f8fafc" rx="8" x="860" y="135" width="165" height="85"/>
  </g>
  <text text-anchor="middle" x="85" y="162">Top-K种子</text><text text-anchor="middle" x="258" y="161">原核心</text>
  <text text-anchor="middle" x="460" y="61">全部核心扩窗合并</text><text text-anchor="middle" x="703" y="61">原选择组织</text>
  <text text-anchor="middle" x="460" y="256">触发核心窗口并集</text><text text-anchor="middle" x="703" y="256">合法细候选</text>
  <text text-anchor="middle" x="943" y="160">原exp07前缀</text><text text-anchor="middle" x="943" y="182">等权覆盖与DP</text>
  <g font-size="13" fill="#475569">
    <text text-anchor="middle" x="85" y="183">仅一个预算K</text><text text-anchor="middle" x="258" y="183">原2秒连接</text>
    <text text-anchor="middle" x="460" y="83">原最终区域保持</text><text text-anchor="middle" x="703" y="83">支持、去重、锚点、参考</text>
    <text text-anchor="middle" x="460" y="279">至少3种子，原±4秒</text><text text-anchor="middle" x="703" y="279">原2 FPS、源帧去重</text>
    <text text-anchor="middle" x="943" y="204">预算及输出按新池重算</text>
    <text text-anchor="middle" x="520" y="334">全部1 FPS粗候选始终保留；绿色分支仅改变新增观测范围，不改蓝色选择组织</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M150,165 H195"/><path d="M320,165 H340 V68 H365"/><path d="M320,165 H340 V262 H365"/>
    <path d="M555,68 H610"/><path d="M555,262 H610"/><path d="M795,68 H943 V135"/><path d="M795,262 H943 V220"/>
  </g>
</svg>
